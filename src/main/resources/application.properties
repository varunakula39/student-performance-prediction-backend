# =====================================================================
# Student Performance Prediction Backend Configuration
# =====================================================================

server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Primary Database Configuration (MySQL)
# Default credentials: root / root
# Set DB_PASSWORD environment variable or change password below to match your MySQL root password
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_performance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Python FastAPI ML Service Endpoint
# ---------------------------------------------------------------------
ml.service.url=${ML_SERVICE_URL:http://localhost:8001/predict}

# ---------------------------------------------------------------------
# JWT Authentication Security Settings
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS) Configuration
# Allows localhost development and production Vercel frontend domains
# ---------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-iota-two-48.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
cors.allowed-patterns=${CORS_ALLOWED_PATTERNS:https://*.vercel.app,http://localhost:[*],http://127.0.0.1:[*]}

# ---------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------
logging.level.com.student.prediction=INFO
logging.level.org.springframework.security=WARN
